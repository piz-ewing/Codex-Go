[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-go"
version = "0.1.0"
description = "Local Codex Desktop bridge for mobile browsers."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "websockets>=13",
]

[project.scripts]
codex-go-server = "codex_go.main:main"

[tool.setuptools.packages.find]
include = ["codex_go*"]

[tool.uv]
package = true
